name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            build_cmd: npm run build:mac
            artifact_pattern: dist/*.dmg
          - os: windows-latest
            platform: win
            build_cmd: npm run build:win
            artifact_pattern: dist/*.exe dist/*.msi
          - os: ubuntu-latest
            platform: linux
            build_cmd: npm run build:linux
            artifact_pattern: dist/*.AppImage dist/*.deb dist/*.rpm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Install dependencies
        run: npm ci

      - name: Prepare macOS Code Signing
        if: matrix.platform == 'mac'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_NAME: ${{ secrets.CSC_NAME }}
        run: |
          if [ -n "$CSC_LINK" ]; then
            echo "Using custom/official certificate from CSC_LINK secret."
            echo "CSC_LINK=$CSC_LINK" >> $GITHUB_ENV
            echo "CSC_KEY_PASSWORD=$CSC_KEY_PASSWORD" >> $GITHUB_ENV
            if [ -n "$CSC_NAME" ]; then
              echo "CSC_NAME=$CSC_NAME" >> $GITHUB_ENV
            fi
          else
            echo "No CSC_LINK secret configured. Generating self-signed certificate for macOS build..."
            bash scripts/setup-mac-self-signing.sh --ci
          fi

      - name: Build application packages
        run: ${{ matrix.build_cmd }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify macOS Code Signature
        if: matrix.platform == 'mac'
        run: |
          echo "Verifying DMG and application signatures:"
          shopt -s nullglob
          for dmg in dist/*.dmg; do
            echo "--- Codesign verification for $dmg ---"
            codesign -dv --verbose=4 "$dmg" 2>&1 || true
          done

      - name: Stage compiled release artifacts
        shell: bash
        run: |
          mkdir -p release-staging
          shopt -s nullglob
          for file in ${{ matrix.artifact_pattern }}; do
            if [ -f "$file" ]; then
              cp "$file" release-staging/
            fi
          done
          echo "Staged artifacts:"
          ls -la release-staging/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-${{ matrix.platform }}
          path: release-staging/
          if-no-files-found: error
          retention-days: 1

  upload-r2:
    name: Upload to Cloudflare R2
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
          merge-multiple: true

      - name: Display downloaded artifacts
        run: |
          echo "Files to upload to R2:"
          ls -la all-artifacts/

      - name: Upload release files to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET_NAME || vars.R2_BUCKET_NAME }}
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ] || [ -z "$R2_ACCOUNT_ID" ] || [ -z "$R2_BUCKET" ]; then
            echo "Error: Missing Cloudflare R2 credentials or configuration variables (AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, R2_ACCOUNT_ID, R2_BUCKET)."
            exit 1
          fi

          R2_ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 cp all-artifacts/ "s3://${R2_BUCKET}/scratchjs-download-files/" \
            --recursive \
            --endpoint-url "$R2_ENDPOINT"

          echo "Upload to Cloudflare R2 completed successfully."
